[project]
name = "nicolasm"
version = "0.1.0"
description = "A small research-oriented language modeling laboratory."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
